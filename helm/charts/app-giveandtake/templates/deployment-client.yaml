apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-client
  labels:
    app: client
spec:
  replicas: {{ .Values.client.replicaCount | default 2 }}
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: client
        image: "{{ .Values.client.repository }}:{{ .Values.client.tag }}"
        imagePullPolicy: Always
        ports:
          - containerPort: {{ .Values.client.containerPort }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        livenessProbe:
          httpGet:
            #path: /health
            path: /
            port: {{ .Values.client.containerPort }}
          initialDelaySeconds: 30
          periodSeconds: 10
        {{/*
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.client.containerPort }}
        */}}