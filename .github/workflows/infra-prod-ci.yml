name: Infrastructure CI

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - 'terraform/**'
      - 'ansible/**'

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2

      - run: terraform init
        working-directory: terraform/environments/prod

      - run: terraform validate
        working-directory: terraform/environments/prod

      - run: terraform plan
        working-directory: terraform/environments/prod
